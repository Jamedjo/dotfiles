[Settings]
# Nightbar is a real theme in ~/.local/share/themes/Nightbar, not an override
# in ~/.config/gtk-3.0/gtk.css, so switching back is just changing this name.
# gsettings org.gnome.desktop.interface gtk-theme must name the SAME theme, or
# GTK3 apps that read GSettings instead of this file (the portal file chooser
# among them) fall back to light Adwaita and none of the palette lands.
gtk-theme-name=Nightbar
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Nightbar
gtk-font-name=Sans 10
gtk-cursor-theme-size=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintfull
gtk-shell-shows-app-menu=true
gtk-shell-shows-menubar=true
