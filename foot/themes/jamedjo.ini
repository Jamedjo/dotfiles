# -*- conf -*-
# The jamedjo palette from .Xresources (urxvt era), which jamedjo.vim styles
# on top of — but keeping the desktop's Deep Navy ground rather than the
# scheme's own 121222. Selected via include= in foot.ini.

[colors]
background=0a1628
foreground=ffffff

## Normal/regular colors (color palette 0-7)
regular0=212121  # black
regular1=af743a  # red -> amber
regular2=444433  # green -> olive
regular3=99997c  # yellow -> sage
regular4=aa9987  # blue -> warm grey
regular5=cccccc  # magenta -> light grey
regular6=ececec  # cyan -> lighter grey
regular7=ffffff  # white

## Bright colors (color palette 8-15)
bright0=78332a   # bright black -> rust
bright1=ff2177   # bright red -> pink
bright2=baba58   # bright green -> chartreuse
bright3=fecc77   # bright yellow -> cream
bright4=77c3e2   # bright blue -> sky
bright5=b291dd   # bright magenta -> lilac
bright6=98dddb   # bright cyan -> aqua
bright7=dbab83   # bright white -> tan

# vim: ft=dosini
