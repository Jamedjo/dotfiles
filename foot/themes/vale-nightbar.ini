# -*- conf -*-
# Vale Nightbar — the desk theme in 16 slots, on the Nightbar ground.
# Slots keep their unix roles: red/green stay honest for diffs, yellow is
# the warn amber, blue is the accent pair, cyan is the wallpaper's teal
# beams and magenta its stage light. Selected via include= in foot.ini.

[colors]
background=0c1c36
foreground=dce9fb

## Normal/regular colors (color palette 0-7)
regular0=182f52  # black -> raised surface
regular1=ff4a4a  # red, the alarm
regular2=43c457  # green, kept honest for diffs
regular3=ffb14d  # yellow -> warn amber
regular4=2f7ff0  # blue, the accent
regular5=c778dd  # magenta -> stage light
regular6=3fd2c4  # cyan -> teal beams
regular7=dce9fb  # white -> body text

## Bright colors (color palette 8-15)
bright0=3f5375   # bright black -> border slate
bright1=ff7a6e   # bright red -> salmon
bright2=74e284   # bright green
bright3=ffc169   # bright yellow -> lit amber
bright4=5aa6ff   # bright blue -> lit
bright5=e0a2f5   # bright magenta -> lilac
bright6=8feee2   # bright cyan -> pale teal
bright7=f2f7ff   # bright white -> headline

## Misc colors
selection-foreground=ffffff
selection-background=2f7ff0
jump-labels=0c1c36 ffb14d
scrollback-indicator=0c1c36 5aa6ff
search-box-no-match=0c1c36 ff4a4a
search-box-match=0c1c36 ffb14d
urls=5aa6ff

# vim: ft=dosini
