# -*- conf -*-
# Valedjo — jamedjo's variety on the Nightbar ground. The regulars
# are muted and warm (terracotta, leaf-olive, amber, mist, dusty rose, sea
# teal); the brights are jamedjo's own family brought to the navy: rust, the
# hot pink, chartreuse, cream, sky, lilac, aqua, and tan standing in for
# bright white. Red/green stay honest enough for diffs. v1 kept conventional
# roles; swap the include= in foot.ini to move between them.

[colors]
background=0c1c36
foreground=d9e6fa

## Normal/regular colors (color palette 0-7)
regular0=182f52  # black -> raised surface
regular1=e0563f  # red -> terracotta, still reads red in a diff
regular2=7fae4f  # green -> leaf-olive, still reads green in a diff
regular3=ffb14d  # yellow -> the desk's warn amber
regular4=849bc4  # blue -> mist, carries comments in vim
regular5=cf85ae  # magenta -> dusty rose
regular6=5fb8ad  # cyan -> sea teal
regular7=d9e6fa  # white -> body text

## Bright colors (color palette 8-15)
bright0=b25c3c   # bright black -> rust
bright1=ff2177   # bright red -> the hot pink
bright2=c9d45f   # bright green -> chartreuse
bright3=fecc77   # bright yellow -> cream
bright4=7fc9ea   # bright blue -> sky
bright5=b291dd   # bright magenta -> lilac
bright6=98dddb   # bright cyan -> aqua
bright7=dfb890   # bright white -> tan

## Misc colors
selection-foreground=ffffff
selection-background=2f7ff0
jump-labels=0c1c36 ffb14d
scrollback-indicator=0c1c36 7fc9ea
search-box-no-match=0c1c36 e0563f
search-box-match=0c1c36 ffb14d
urls=7fc9ea

# vim: ft=dosini
