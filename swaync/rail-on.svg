<svg xmlns="http://www.w3.org/2000/svg" width="80" height="48" viewBox="0 0 80 48">
  <!-- The rail under a toggle icon. Flat rects only, no gradient element: a
       file with a linearGradient in it loads through gdk-pixbuf and then draws
       nothing as a CSS background.
       The position keyword must stay a plain center. With "center bottom" the
       image is not drawn at all, which is what made this look impossible. -->
  <defs><filter id="glow" x="-80%" y="-600%" width="260%" height="1300%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
  <rect x="30" y="39" width="20" height="3" rx="1.5" fill="#4d9dff" filter="url(#glow)" opacity="0.85"/>
  <rect x="30" y="40" width="20" height="2" rx="1" fill="#4d9dff"/>
</svg>
