# Chief AI Assistant Overlay Configuration for Sway
# This file configures the Chief Electron app as a floating overlay

# Match by app_id (Wayland native)
for_window [app_id="chief"] {
    floating enable
    sticky enable
    move position center
    #move up 250px
    border none
    #opacity 0.92
    # Keep on top of other windows
    focus
}

# Match by class (XWayland fallback)
for_window [class="chief"] {
    floating enable
    sticky enable
    move position center
    #move up 250px
    border none
    #opacity 0.92
    focus
}

# Match Electron by window title as fallback
for_window [title="Chief - Your AI Chief of Staff"] {
    floating enable
    sticky enable
    move position center
    #move up 250px
    border none
    #opacity 0.92
    focus
}
