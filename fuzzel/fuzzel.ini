# Nightbar: the panel ground, and the accent as a filled selection - the same
# fill the focused workspace and switchboard's current row take.
# fuzzel draws no shadow and no gradient, so the hairline the rest of the theme
# drops is kept here: it is the only edge the popup can have.
# Needs fuzzel >= 1.11 for mouse clicks; Ubuntu ships 1.9.2, so 1.14.1 is
# built from source into /usr/local/bin (which shadows the apt binary).
[main]
prompt=❯ 
font=Ubuntu Nerd Font:size=14
icons-enabled=yes
icon-theme=Adwaita
lines=12
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=36
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=0c1c36f2
text=dce9fbff
match=5aa6ffff
selection=2f7ff0ff
selection-text=dbeaffff
selection-match=ffffffff
border=2f7ff066

[border]
width=1
radius=16
