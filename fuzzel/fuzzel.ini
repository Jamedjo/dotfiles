# Chief's Deep Navy chrome: navy ground, Twilight selection, brand blue matches.
# Mirrors chrome-chief styles/theme.css. See workspaces.ini for the sway switcher.
[main]
prompt=❯ 
font=Ubuntu Nerd Font:size=14
icons-enabled=yes
icon-theme=Adwaita
lines=12
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=28
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=0f1f38f2
text=ffffffe6
match=4a9effff
selection=2b4470ff
selection-text=ffffffff
selection-match=4a9effff
border=4a9eff66

[border]
width=1
radius=14
