# fuzzel as a sway workspace switcher, on the nightbar palette: panel ground
# behind, the accent as a filled selection.
[main]
prompt=❯ 
font=Ubuntu Nerd Font:size=14
icons-enabled=no
lines=10
width=32
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=28
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=0c1c36f2
text=dce9fbff
match=5aa6ffff
selection=2f7ff0ff
selection-text=dbeaffff
selection-match=ffffffff
border=2f7ff066

[border]
width=1
radius=16
