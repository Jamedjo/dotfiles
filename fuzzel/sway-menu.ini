# fuzzel as a sway workspace switcher, wearing Chief's Deep Navy chrome.
# Navy ground behind, Twilight slab for the selection, brand blue for matches.
[main]
prompt=❯ 
font=Ubuntu Nerd Font:size=14
icons-enabled=no
lines=10
width=32
horizontal-pad=20
vertical-pad=14
inner-pad=10
line-height=28
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=0f1f38f2
text=ffffffe6
match=4a9effff
selection=2b4470ff
selection-text=ffffffff
selection-match=4a9effff
border=4a9eff66

[border]
width=1
radius=14
